<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1514">
  <title>FPV Техшкола</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1514;--card:#142320;--card2:#1b302a;--line:#2b4038;--text:#eff7f2;--muted:#a8bbb1;--green:#79e6b6;--amber:#ffbd78}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 2%,#15392d 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
    .shell{max-width:620px;min-height:100vh;margin:auto;padding:0 18px 82px}.top{height:68px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center;font-weight:800;letter-spacing:.1em}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--green);color:#102019;font-size:20px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.16em}.pill{border:1px solid var(--line);border-radius:20px;padding:6px 9px;color:var(--muted);font-size:9px;letter-spacing:.1em}.pill i{display:inline-block;width:6px;height:6px;border-radius:100%;background:var(--green);margin-right:5px}.hidden{display:none!important}
    .hero{padding:23px 21px;border:1px solid #2a5946;border-radius:22px;background:linear-gradient(145deg,#1b392d,#14231f)}.eyebrow{color:var(--green);font-size:10px;font-weight:800;letter-spacing:.16em}.hero h1{font-size:clamp(27px,7vw,38px);line-height:1.12;letter-spacing:-.04em;margin:9px 0}.hero p{color:#c1d1c8;font-size:13px;max-width:380px;margin:0 0 17px}.btn{min-height:44px;padding:0 15px;border:1px solid var(--line);border-radius:13px;background:var(--card2);color:var(--text);font-weight:800}.primary{background:var(--green);border-color:var(--green);color:#0d1c16}.head{display:flex;justify-content:space-between;align-items:end;margin:24px 2px 12px}.head h2{font-size:19px;margin:0}.head span,.muted{color:var(--muted);font-size:11px}.progress{margin-top:13px;padding:13px 15px;border:1px solid var(--line);border-radius:16px;background:#12201d}.progressline{display:flex;justify-content:space-between;font-size:11px;margin-bottom:9px}.progressline span{color:var(--green);font-weight:800}.track{height:5px;border-radius:9px;background:#2c4038;overflow:hidden}.fill{height:100%;background:var(--green);transition:width .2s}.list{display:grid;gap:9px}.module{width:100%;display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);text-align:left}.module.ready{border-color:#47795f}.num{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#203b30;color:var(--green);font-size:11px;font-weight:800}.mcopy b{display:block;font-size:12px;line-height:1.3}.mcopy small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.status{font-size:9px;color:var(--muted);white-space:nowrap}.ready .status{color:var(--green)}
    .lesson-head{display:flex;align-items:center;gap:11px;margin:7px 0 16px}.back{width:39px;height:39px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:20px}.lesson-head h1{margin:2px 0 0;font-size:23px}.video{min-height:165px;display:grid;place-items:center;border:1px solid #315b48;border-radius:19px;background:radial-gradient(circle,#23563e,#10201b 68%);text-align:center}.play{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;margin:0 auto 8px;background:var(--green);color:#102019}.video b{display:block;font-size:13px}.video small{color:var(--muted);font-size:10px}.caption{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin:8px 3px}.intro{color:#c1d1c8;font-size:13px;margin:17px 2px}.slide{min-height:200px;padding:18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#1a3028,#12201d)}.slide-top{display:flex;justify-content:space-between;color:var(--green);font-size:9px;font-weight:800;letter-spacing:.12em;margin-bottom:15px}.slide h2{font-size:21px;line-height:1.2;margin:0 0 9px}.slide p{font-size:12px;color:#c5d4cc;margin:0}.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:15px}.step{padding:7px 9px;border:1px solid #365c49;border-radius:10px;background:#203a30;font-size:10px;font-weight:700}.arrow{color:var(--green)}.controls{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-top:10px}.controls .btn{min-height:39px;font-size:10px;padding:0 10px}.dots{display:flex;gap:4px}.dot{width:6px;height:6px;border-radius:8px;background:#455b50}.dot.active{width:16px;background:var(--green)}.note{padding:12px;margin-top:14px;border-left:3px solid var(--amber);border-radius:0 12px 12px 0;background:#2d281f;color:#dac8af;font-size:11px}
    .question{padding:15px;margin:12px 0;border:1px solid var(--line);border-radius:16px;background:var(--card)}.question h3{font-size:13px;margin:0 0 10px}.answer{display:block;padding:9px 10px;margin-top:6px;border:1px solid var(--line);border-radius:10px;font-size:11px}.answer input{accent-color:var(--green);margin-right:6px}.answer.correct{border-color:var(--green);background:#18392b}.answer.wrong{border-color:#ff8875;background:#382722}.result{min-height:22px;font-size:12px;font-weight:700}.result.good{color:var(--green)}.result.retry{color:var(--amber)}.finish{padding:14px;border:1px solid #3d7959;border-radius:15px;background:#183226;margin-top:12px}.finish b{color:var(--green)}.finish p{font-size:11px;color:#c7d7ce;margin:4px 0 0}.nav{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,620px);display:flex;justify-content:center;gap:45px;padding:10px 18px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0b1514ee}.nav button{border:0;background:none;color:#82968c;font-size:9px}.nav button.active{color:var(--green)}.toast{position:fixed;z-index:9;bottom:73px;left:50%;transform:translateX(-50%);max-width:90%;padding:10px 13px;border-radius:12px;background:#294338;font-size:11px}
    @media(max-width:370px){.shell{padding-inline:13px}.hero{padding:20px 17px}.module{grid-template-columns:34px 1fr auto;gap:8px;padding:10px}.num{width:34px;height:34px}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top"><div class="brand"><span class="mark">F</span><span>FPV<small>ТЕХШКОЛА</small></span></div><span class="pill"><i></i>ОФЛАЙН-КУРС</span></header>
  <section id="home"></section><section id="lesson" class="hidden"></section><section id="quiz" class="hidden"></section>
</main>
<nav class="nav"><button id="courseNav" class="active">▤ &nbsp;КУРС</button><button id="progressNav">◷ &nbsp;ПРОГРЕСС</button></nav>
<script>
const modules=[
 ["Что такое FPV?","Камера, видеолиния, управление и телеметрия","3 мин"],
 ["Из чего состоит FPV-дрон","Компоненты и соединения","6 мин"],
 ["Основы радиоволн","Частота, длина волны, мощность, помехи","7 мин"],
 ["Радиочастоты","Диапазоны, каналы, совместимость","6 мин"],
 ["Канал управления","ELRS, Crossfire, телеметрия и failsafe","8 мин"],
 ["Видеолиния","Аналоговое и цифровое видео","7 мин"],
 ["Антенны","Типы, усиление, размещение, поляризация","8 мин"],
 ["Как идёт радиосигнал","Отражение, дифракция, зона Френеля","7 мин"],
 ["Электроника и подключение","Питание, UART и протоколы","9 мин"],
 ["Настройка и диагностика","Проверки перед запуском и поиск неисправностей","9 мин"]
];
const slides=[
 ["FPV — это вид от первого лица","Камера на дроне передаёт изображение в очки или на экран. Пилот видит полёт так, будто находится на борту.",["Камера","Видеопередатчик","Радиоволна","Приёмник","Очки"]],
 ["Видео проходит отдельный путь","Камера формирует изображение. Видеопередатчик отправляет его через антенну, а приёмник передаёт картинку в очки.",["Камера","VTX","Антенна","VRX","Экран"]],
 ["Команды идут по радиоканалу","Пульт отправляет команды приёмнику на дроне. Этот канал нужен для управления и работает отдельно от видеолинии.",["Пульт","Передатчик","Радиоволна","Приёмник","Контроллер"]],
 ["Телеметрия возвращает данные","Телеметрия может сообщать пульту о состоянии дрона. Состав данных зависит от установленного оборудования и настроек.",["Дрон","Телеметрия","Радиоканал","Пульт"]],
 ["Три части FPV-системы","Разделяй видеолинию, канал управления и телеметрию. Они связаны между собой, но выполняют разные задачи.",["Видео","Управление","Телеметрия"]],
 ["Проверяй совместимость всей цепочки","Сверь протокол передатчика и приёмника, а также систему и диапазон видеопередатчика и очков.",["Модель","Диапазон","Протокол","Настройка"]]
];
const questions=[
 ["Что передаёт изображение с дрона в FPV-очки?",["Видеолиния","Только канал управления","Только телеметрия"],0],
 ["Для чего нужен канал управления?",["Чтобы отправлять команды дрону","Чтобы заряжать аккумулятор","Чтобы измерять длину антенны"],0],
 ["Что может передавать телеметрия?",["Данные о состоянии дрона","Питание в пропеллеры","Изображение с камеры напрямую"],0]
];
const home=document.getElementById('home'),lesson=document.getElementById('lesson'),quiz=document.getElementById('quiz');let slide=0;
const done=()=>localStorage.getItem('fpv01done')==='1';
function screen(el){[home,lesson,quiz].forEach(x=>x.classList.add('hidden'));el.classList.remove('hidden')}
function renderHome(progress=false){screen(home);document.getElementById('courseNav').classList.toggle('active',!progress);document.getElementById('progressNav').classList.toggle('active',progress);
if(progress){home.innerHTML=`<div class="eyebrow">ТВОЙ ПРОГРЕСС</div><h1>Учись по шагам</h1><p class="muted">Короткие видео, наглядные презентации и тесты.</p><div class="progress"><div class="progressline"><b>Пройдено уроков</b><span>${done()?'1 из 10':'0 из 10'}</span></div><div class="track"><div class="fill" style="width:${done()?10:0}%"></div></div></div><p class="muted" style="margin-top:14px">${done()?'Урок «Что такое FPV?» пройден. Следующий появится после подготовки.':'Заверши первый урок, чтобы начать отслеживать прогресс.'}</p>`;return}
home.innerHTML=`<section class="hero"><div class="eyebrow">ТЕХНИЧЕСКАЯ БАЗА FPV</div><h1>Разберись, как устроен FPV</h1><p>Понятные уроки о радиосвязи, видеолинии, антеннах и электронике дрона.</p><button class="btn primary" id="start">${done()?'Повторить первый урок':'Начать первый урок'} →</button></section><div class="progress"><div class="progressline"><b>Твой прогресс</b><span>${done()?'10%':'0%'}</span></div><div class="track"><div class="fill" style="width:${done()?10:0}%"></div></div></div><div class="head"><h2>Программа курса</h2><span>10 тем</span></div><div class="list">${modules.map((m,i)=>`<button class="module ${i===0?'ready':''}" data-i="${i}"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="mcopy"><b>${m[0]}</b><small>${m[1]}</small></span><span class="status">${i===0?(done()?'Пройден':m[2]):'В программе'}</span></button>`).join('')}</div>`;
document.getElementById('start').onclick=openLesson;home.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>Number(b.dataset.i)===0?openLesson():toast('Этот урок появится в следующем обновлении курса.'))}
function openLesson(){slide=0;renderLesson()}
function renderLesson(){screen(lesson);const s=slides[slide];lesson.innerHTML=`<div class="lesson-head"><button class="back" id="back">‹</button><div><div class="eyebrow">УРОК 01 · ОСНОВЫ</div><h1>Что такое FPV?</h1></div></div><div class="video"><div><div class="play">▶</div><b>Короткий видеоурок</b><small>место для ролика на 2–4 минуты</small></div></div><div class="caption"><span>Видеоурок</span><span>2–4 минуты</span></div><p class="intro">Посмотри ролик, затем разберись в схеме на презентационных карточках.</p><div class="head"><h2>Презентация</h2><span>Экран ${slide+1} / ${slides.length}</span></div><article class="slide"><div class="slide-top"><span>КЛЮЧЕВАЯ МЫСЛЬ</span><span>0${slide+1}</span></div><h2>${s[0]}</h2><p>${s[1]}</p><div class="flow">${s[2].map((x,i)=>`${i?'<span class="arrow">→</span>':''}<span class="step">${x}</span>`).join('')}</div></article><div class="controls"><button class="btn" id="prev" ${slide===0?'disabled':''}>← Назад</button><div class="dots">${slides.map((_,i)=>`<i class="dot ${i===slide?'active':''}"></i>`).join('')}</div>${slide<slides.length-1?'<button class="btn" id="next">Дальше →</button>':'<button class="btn primary" id="toQuiz">К тесту →</button>'}</div><div class="note"><b>Запомни:</b> видео, управление и телеметрия — разные части FPV-системы.</div>`;
document.getElementById('back').onclick=()=>renderHome();const p=document.getElementById('prev');if(p)p.onclick=()=>{slide--;renderLesson()};const n=document.getElementById('next');if(n)n.onclick=()=>{slide++;renderLesson()};const q=document.getElementById('toQuiz');if(q)q.onclick=renderQuiz}
function renderQuiz(){screen(quiz);quiz.innerHTML=`<div class="lesson-head"><button class="back" id="backLesson">‹</button><div><div class="eyebrow">ЗАКРЕПЛЕНИЕ</div><h1>Проверим, что запомнилось</h1></div></div><p class="muted">Выбери один ответ на каждый вопрос.</p><form id="form">${questions.map((q,i)=>`<fieldset class="question" data-q="${i}"><h3>${i+1}. ${q[0]}</h3>${q[1].map((a,j)=>`<label class="answer"><input type="radio" name="q${i}" value="${j}">${a}</label>`).join('')}</fieldset>`).join('')}<div id="result" class="result"></div><button class="btn primary">Проверить ответы</button></form><div id="finish"></div>`;
document.getElementById('backLesson').onclick=()=>renderLesson();document.getElementById('form').onsubmit=e=>{e.preventDefault();let score=0;questions.forEach((q,i)=>{const picked=document.querySelector(`input[name=q${i}]:checked`);if(picked&&Number(picked.value)===q[2])score++;document.querySelectorAll(`[data-q="${i}"] .answer`).forEach((label,j)=>{label.classList.toggle('correct',j===q[2]);label.classList.toggle('wrong',Boolean(picked)&&Number(picked.value)===j&&j!==q[2])})});const r=document.getElementById('result');if(score===questions.length){localStorage.setItem('fpv01done','1');r.className='result good';r.textContent=`Отлично! Правильных ответов: ${score} из ${questions.length}.`;document.getElementById('finish').innerHTML='<div class="finish"><b>Урок пройден ✓</b><p>Ты различаешь видеолинию, управление и телеметрию.</p></div>'}else{r.className='result retry';r.textContent=`Правильных ответов: ${score} из ${questions.length}. Посмотри отмеченные ответы и попробуй ещё раз.`;document.getElementById('finish').innerHTML=''}}}
function toast(text){const t=document.createElement('div');t.className='toast';t.textContent=text;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
document.getElementById('courseNav').onclick=()=>renderHome();document.getElementById('progressNav').onclick=()=>renderHome(true);renderHome();
</script>
</body>
</html>
