  {chapter:"ЧАСТЬ 2 · УСТРОЙСТВО",title:"Из чего состоит FPV-дрон",body:"На схеме показаны рама, аккумулятор, моторы, контроллер, регуляторы, приёмник и видеосистема. Провода передают питание и данные, а антенны связывают радиомодули с внешними устройствами.",flow:["Питание","Управление","Видео"],image:"img/drone-diagram.webp",caption:"Схема компонентов из твоей презентации"},
  {chapter:"ЧАСТЬ 2 · УСТРОЙСТВО",title:"Рама держит компоненты",body:"Рама состоит из центральных пластин и лучей. Она задаёт форму аппарата и точки крепления. Материал влияет на массу, прочность и электропроводность, поэтому размещение радиооборудования учитывают по инструкции производителя.",flow:["Пластины","Лучи","Крепления"],images:[["img/frame-x.webp","X-образная форма"],["img/frame-deadcat.webp","Dead Cat"]]},
  {chapter:"ЧАСТЬ 2 · УСТРОЙСТВО",title:"Мотор и пропеллер создают тягу",body:"Винтомоторная группа объединяет электромотор и пропеллер. Мотор вращает пропеллер, а поток воздуха создаёт тягу. Регулятор оборотов ESC управляет работой мотора.",flow:["Электропитание","Мотор","Пропеллер","Тяга"],image:"img/motor-prop.webp",caption:"Мотор с пропеллером"},
  {chapter:"ЧАСТЬ 2 · УСТРОЙСТВО",title:"FC и ESC выполняют разные задачи",body:"Полётный контроллер FC обрабатывает данные датчиков и команды управления. Регулятор ESC подаёт питание на моторы и меняет их обороты по командам контроллера. Эти платы часто устанавливают комплектом, который называют стеком.",flow:["FC · обрабатывает данные","ESC · управляет моторами","Моторы"],image:"img/flight-stack.webp",caption:"Платы контроллера и регулятора"},
  {chapter:"ЧАСТЬ 2 · УСТРОЙСТВО",title:"Пульт и приёмник передают команды",body:"Передатчик TX находится в пульте. Бортовой приёмник RX принимает команды и передаёт их контроллеру. TX и RX должны поддерживать совместимый протокол и подходящую версию оборудования.",flow:["Пульт · TX","Радиоканал","Приёмник · RX","FC"],image:"img/radio.webp",caption:"Пульт управления"},
  {chapter:"ЧАСТЬ 2 · УСТРОЙСТВО",title:"Камера и видеоприёмник образуют видеолинию",body:"Камера CAM получает изображение. Видеопередатчик VTX отправляет его по радиоканалу, а приёмник VRX в очках или на экране принимает картинку. Это отдельная система со своей совместимостью.",flow:["Камера · CAM","VTX","Радиоканал","VRX","Очки"],images:[["img/fpv-camera.webp","FPV-камера"],["img/goggles.webp","Видеоочки"]]},
  {chapter:"ЧАСТЬ 2 · УСТРОЙСТВО",title:"Антенны работают с радиоволнами",body:"Антенна связывает радиомодуль с электромагнитной волной. Линейная и круговая поляризация описывают ориентацию электрического поля. Несовпадение поляризации и близкие материалы могут влиять на качество приёма.",flow:["Радиомодуль","Антенна","Радиоволна"],image:"img/antennas.webp",caption:"Примеры линейных и круговых антенн"},
  {chapter:"ЧАСТЬ 2 · УСТРОЙСТВО",title:"Аккумулятор питает систему",body:"Аккумуляторная батарея даёт энергию бортовым компонентам. Тип батареи, разъёмы и порядок обслуживания зависят от модели. При зарядке и хранении следуй инструкции производителя и используй подходящее зарядное устройство.",flow:["Батарея","Контроллеры","Моторы и периферия"],image:"img/battery.webp",caption:"Аккумуляторная батарея"},
  {chapter:"ЧАСТЬ 2 · УСТРОЙСТВО",title:"Видео и управление — разные каналы",body:"Канал управления переносит команды от TX к RX. Видеолиния переносит изображение от камеры к очкам. Телеметрия может возвращать отдельные данные с борта. Наличие телеметрии и её состав зависят от оборудования.",flow:["TX → RX · команды","CAM → VRX · видео","Борт ↔ пульт · телеметрия"]},
  {chapter:"ЧАСТЬ 3 · ПРОТОКОЛЫ",title:"Протокол — общий язык передатчика и приёмника",body:"Протокол задаёт формат обмена данными между радиопередатчиком и приёмником. Для связи устройства должны поддерживать совместимый протокол, диапазон и версию прошивки. Название протокола само по себе не гарантирует совместимость любой пары устройств.",flow:["TX","Протокол","RX"]},
  {chapter:"ЧАСТЬ 3 · ПРОТОКОЛЫ",title:"TBS Crossfire",body:"Crossfire — протокол управления от Team Black Sheep. Это закрытая система, поэтому совместимость зависит от оборудования, которое поддерживает Crossfire. Утверждение, что радиоканал невозможно перехватить, нельзя считать гарантией безопасности.",flow:["Система TBS","Совместимый TX","Совместимый RX"],note:"Проверяй требования производителя и местные правила использования радиоустройств."},
  {chapter:"ЧАСТЬ 3 · ПРОТОКОЛЫ",title:"ExpressLRS",body:"ExpressLRS — открытый проект радиоуправления. Устройства могут различаться поддерживаемым диапазоном, аппаратной платформой и версией прошивки. Фраза привязки помогает настроить совместную работу устройств, поэтому её не следует публиковать.",flow:["Открытый проект","Совместимые версии","Проверка оборудования"],note:"Открытый исходный код сам по себе не означает ни лучшую, ни худшую защиту."},
  {chapter:"ЧАСТЬ 3 · ПРОТОКОЛЫ",title:"Сверяй частоту и региональные правила",body:"Радиомодули выпускаются для разных диапазонов. Доступные частоты и ограничения зависят от страны и конкретного оборудования. Сверяй маркировку, документацию и местные требования до использования системы.",flow:["Страна","Диапазон устройства","Совместимая пара"]},
  {chapter:"ЧАСТЬ 4 · ВИДЕОСВЯЗЬ",title:"Аналоговое видео постепенно теряет качество",body:"В аналоговой видеосистеме помехи обычно заметны как шум и ухудшение картинки. Задержка и поведение при слабом сигнале зависят от камеры, передатчика, приёмника и дисплея.",flow:["Изображение","Аналоговый сигнал","Приёмник"]},
  {chapter:"ЧАСТЬ 4 · ВИДЕОСВЯЗЬ",title:"Цифровое видео передаёт данные пакетами",body:"Цифровая система кодирует изображение и передаёт данные. При хорошем соединении картинка обычно чёткая. При ошибках возможны задержка, артефакты или потеря изображения. Конкретное поведение зависит от системы.",flow:["Камера","Цифровые данные","Очки или экран"]},
  {chapter:"ЧАСТЬ 4 · ВИДЕОСВЯЗЬ",title:"У аналоговой и цифровой систем разные компромиссы",body:"У систем отличаются качество изображения, задержка и то, как проявляются помехи. Сравнивай конкретные модели и условия применения по документации производителя. По одному слову «цифровая» или «аналоговая» нельзя предсказать поведение всего комплекта.",flow:["Качество","Задержка","Поведение при помехах"]},
  {chapter:"ЧАСТЬ 4 · ВИДЕОСВЯЗЬ",title:"Собери цепочку видеосигнала",body:"Проследи изображение от камеры до экрана: камера передаёт сигнал видеомодулю, VTX отправляет его через антенну, а VRX в очках или наземном экране принимает картинку.",flow:["CAM","VTX","Антенна","VRX","Экран"]},
  {chapter:"ИТОГ ЗАНЯТИЯ",title:"Что важно запомнить",body:"У FPV-системы есть несколько связанных, но отдельных частей. Понимай назначение каждого компонента и проверяй совместимость по документации. Протокол не делает систему автоматически защищённой, а параметры радиоустройства должны соответствовать местным правилам.",flow:["Конструкция","Управление","Видео","Правила"]}
];

  show(quiz);
  quiz.innerHTML=`<div class="lesson-head"><button class="back" id="backLesson" aria-label="Назад к уроку"><svg viewBox="0 0 24 24" fill="none"><path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="lesson-ident"><div class="eyebrow"><i class="eyedot"></i> ЗАКРЕПЛЕНИЕ</div><h1>Проверим занятие</h1></div></div><p class="quiz-intro">Пять коротких вопросов. Выбери один ответ на каждый.</p><form id="form">${questions.map((q,i)=>`<fieldset class="question" data-q="${i}"><h3>${String(i+1).padStart(2,'0')} &nbsp;${q[0]}</h3>${q[1].map((a,j)=>`<label class="answer"><input type="radio" name="q${i}" value="${j}"><span class="choice-dot">✓</span><span>${a}</span></label>`).join('')}</fieldset>`).join('')}<div id="result" class="result"></div><button class="primary" style="width:100%">Проверить ответы <span aria-hidden="true">→</span></button></form><div id="finish"></div>`;
  document.getElementById('backLesson').onclick=()=>renderLesson();
  quiz.querySelectorAll('.answer input').forEach(input=>input.addEventListener('change',()=>{quiz.querySelectorAll(`input[name="${input.name}"]`).forEach(x=>x.closest('.answer').classList.toggle('selected',x.checked))}));
  document.getElementById('form').onsubmit=e=>{e.preventDefault();let score=0;questions.forEach((q,i)=>{const picked=document.querySelector(`input[name=q${i}]:checked`);if(picked&&Number(picked.value)===q[2])score++;document.querySelectorAll(`[data-q="${i}"] .answer`).forEach((label,j)=>{label.classList.toggle('correct',j===q[2]);label.classList.toggle('wrong',Boolean(picked)&&Number(picked.value)===j&&j!==q[2])})});const r=document.getElementById('result');if(score===questions.length){localStorage.setItem('fpv_lesson1_v2_done','1');r.className='result good';r.textContent=`Отлично! Правильных ответов: ${score} из ${questions.length}.`;document.getElementById('finish').innerHTML='<div class="finish"><b>Занятие пройдено ✓</b><p>Ты разобрал типы аппаратов, основные компоненты и различия каналов управления и видео.</p></div>'}else{r.className='result retry';r.textContent=`Правильных ответов: ${score} из ${questions.length}. Посмотри подсказки и попробуй ещё раз.`;document.getElementById('finish').innerHTML=''}};
}
function toast(text){const t=document.createElement('div');t.className='toast';t.textContent=text;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
document.getElementById('courseNav').onclick=()=>renderHome();document.getElementById('progressNav').onclick=()=>renderHome(true);renderHome();
</script>
</body>
