name: Build FPV Tech School APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag such as v0.1.0; set it to publish a GitHub Release"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    name: Build standalone FPV APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out FPV Tech School
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug

      - name: Give APK a distinct name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/FPV-Tech-School-debug-${GITHUB_RUN_NUMBER}.apk"

      - name: Upload FPV APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: FPV-Tech-School-APK-${{ github.run_number }}
          path: dist/FPV-Tech-School-debug-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v7
        with:
          name: FPV-Tech-School-APK-${{ github.run_number }}
          path: dist

      - name: Create release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          original="dist/FPV-Tech-School-debug-${GITHUB_RUN_NUMBER}.apk"
          asset="dist/FPV-Tech-School-${RELEASE_TAG#v}.apk"
          cp "$original" "$asset"
          gh release create "$RELEASE_TAG" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FPV Техшкола ${RELEASE_TAG}" \
            --notes "Первая отладочная версия FPV Техшколы: вводный урок «Что такое FPV?», презентационные карточки и тест."
